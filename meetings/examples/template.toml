# 會議設定（實驗中）：複製成 meetings/<id>.toml（個人設定不進 git）；不使用 courses/。
# 錄音／匯入：lec meeting run <id> --speakers N [--file 音檔]
# 會後辨識：lec meeting diarize <session 資料夾> --speakers N
# 目前只有 CLI；正式 UI 控制尚未開放，雙來源錄音入口仍停用。
[meeting]
name = ""

[diarization]
num_speakers = 0  # 尚未指定；執行辨識時必須提供 1..30，不等於實際發言者數

# 可選的會議專用覆寫；未寫的鍵繼承 default.toml → local.toml。
