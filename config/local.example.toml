# 複製成 config/local.toml 使用（local.toml 不進 git）
# 放「只跟這台電腦有關」的設定；合併順序在 default.toml 之後、課程設定之前。

[audio]
source = "mic1"               # 也可以直接填 pulse 來源全名；用 lec devices 查詢

[audio.sources.mic1]
pulse = "alsa_input.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Mic1__source"
description = "內建麥克風"

[audio.sources.mic2]
pulse = "alsa_input.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Mic2__source"
description = "耳機孔麥克風"

