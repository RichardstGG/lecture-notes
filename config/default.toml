# ===== 課堂筆記系統：全域預設設定 =====
# 課程設定檔（courses/<課名>.toml）只需寫跟這裡不同的項目。
# 合併順序：本檔 → config/local.toml（這台電腦專屬，不進 git）→ courses/<課名>.toml
#          → 指令列（--model / --source / --set 區塊.鍵=值）
# 麥克風、路徑等只跟這台電腦有關的設定請寫在 config/local.toml（lec devices --save 會幫你寫）。
# 每次執行的最終設定會存到 <輸出資料夾>/config.used.toml。
# 路徑可用 ~；相對路徑以 app 根目錄（lec 所在資料夾）為基準。

[course]
name = ""                     # 空白 = 用設定檔檔名

[paths]
output_root = "outputs"       # 相對路徑 = app 根目錄下
session_name = "{course}_{date:%Y%m%d}"   # 每堂課的子資料夾名稱；可用 / 分層，例如 "{course}/{date:%Y%m%d}"；同名已存在時自動加 _HHMM
state_dir = "auto"            # 執行鎖與 server 紀錄；auto = 各平台標準位置（Linux ~/.local/state/lecture-notes）
whisper_dir = "whisper.cpp"   # 內含 build/bin/whisper-server
llama_dir = "llama.cpp"       # 內含 build/bin/llama-server

[system]
inhibit_sleep = true          # 執行期間阻止休眠 / 閒置 / 蓋螢幕休眠（systemd-inhibit）
opencc = true                 # 若有安裝 opencc，轉成台灣繁體用語（sudo apt install opencc）
status_interval = 2           # status.json 更新間隔（秒）

# ---------------------------------------------------------------- 錄音
[audio]
backend = "auto"              # auto = 依作業系統（Linux pulse、macOS avfoundation、Windows dshow）
source = "default"            # default = 系統預設麥克風；或 [audio.sources.*] 的名稱、pulse 來源全名
                              # 用 lec devices 列出可用來源，lec devices --save <編號> 存到 local.toml
keep_recording = true         # 保留整堂錄音（ogg/opus 32k，3 小時約 45MB）
sources = {}                  # 音源短名稱表，請在 local.toml 定義（見下方範例）

# 可在 local.toml 為常用來源取短名稱，例如：
# [audio.sources.mic1]
# pulse = "alsa_input.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Mic1__source"
# description = "內建麥克風"

# ---------------------------------------------------------------- 轉錄
[whisper]
model = "large-v3-turbo"      # [whisper.models.*] 的名稱
host = "127.0.0.1"
port = 8178
threads = 8
language = "zh"
# 帶標點的 prompt 會讓輸出也傾向加標點
prompt = "以下是繁體中文的大學課堂內容，老師會中英夾雜地講解。"
# 課程術語：接在 whisper prompt 後面，也提供給總結當錯字參考（whisper prompt 有長度上限，建議 20 個以內）
terms = []

[whisper.models.large-v3-turbo]
path = "whisper.cpp/models/ggml-large-v3-turbo.bin"

[vad]
min_chunk = 12                # 至少累積幾秒才找停頓切段
max_chunk = 30                # 最長幾秒，一直沒停頓就在最安靜處強制切
file_min_chunk = 24           # --file 模式的最短段落（填滿 whisper 30 秒視窗較有效率）
silence_ms = 500              # 停頓多久算可以切
sensitivity = 2.5             # 高於環境噪音幾倍算人聲；教室吵調高（3–4），老師小聲調低（1.8–2）
min_voiced = 0.08             # 有聲比例低於此值的段落直接略過

[transcript]
section_minutes = 5           # 每幾分鐘一個 ## 時間小標題（也是總結的單位）
para_gap = 2.5                # 停頓超過幾秒就換段落
para_max = 180                # 段落超過幾個字就換段

# ---------------------------------------------------------------- 總結
[llm]
host = "127.0.0.1"
port = 8179
ctx = 8192
ngl = 99
parallel = 1
startup_timeout = 300         # 載入模型最多等幾秒
extra_args = ["--jinja"]      # 額外傳給 llama-server 的參數

[models.qwen3-8b]
path = "models/Qwen3-8B-Q4_K_M.gguf"
disable_thinking = true       # Qwen3：chat_template_kwargs enable_thinking=false + /no_think

[models.qwen3-4b]
path = "models/Qwen3-4B-Q4_K_M.gguf"
disable_thinking = true

[summary]
enabled = true
model = "qwen3-8b"            # [models.*] 的名稱
file_mode = "after"           # --file 模式：after = 轉錄完才總結；off = 不總結
prompt_file = "prompts/summary.md"
extra_instructions = ""       # 追加在 prompt 後的課程專屬說明
context_sections = 3          # 前情提要帶前幾段的主題
min_chars = 150               # 少於這個字數的小節併入下一節
empty_chars = 30              # 結尾剩下少於這個字數就直接寫「本段無內容」
temperature = 0.2
top_p = 0.9
max_tokens = 1200             # 單段輸出上限；8B 實測每段 350–680 tokens，被截斷時會自動放寬重試
request_timeout = 240         # 單次請求逾時（秒）
retries = 2                   # 失敗重試次數
poll_seconds = 10             # 多久檢查一次逐字稿
final_wait = 180              # Ctrl+C 後最多等最後一段總結幾秒
quote_match = 0.8             # 「老師強調」原句與逐字稿的最低相似度
unverified_terms = "mark"     # 逐字稿找不到的術語：mark = 標 ⚠、drop = 刪除、keep = 不處理

# 術語對照表：正式寫法 = "說明"，或 = { means = "說明", aka = ["逐字稿可能出現的錯誤寫法"] }
# 只在課程檔定義；供總結時認詞與填 asr_original 用，不會寫進筆記內容
[summary.glossary]
